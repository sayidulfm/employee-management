<!DOCTYPE html> 
<html lang="id"
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Manajemen Karyawan{% endblock %}</title>
   <style>
        body{ font-family: system-ui, sans-serif; margin: 0; background-color: #f5f6f8; color: #222;}
        nav { background: #1f2937; padding: 12px 24px; display: flex; gap: 16px; align-items: center; }
        nav a, nav button { color: #fff; text-decoration: none; background: none; border: none; font-size: 15px; cursor: pointer; }
        nav .spacer { flex: 1; }
        main { max-width: 960px; margin: 24px auto; background: #fff; padding: 24px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin: 16px 0; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e5e7eb; }
        .btn { display: inline-block; padding: 6px 12px; background: #2563eb; color: #fff; border: none; border-radius: 4px; text-decoration: none; cursor: pointer; font-size: 14px; }
        .btn-danger { background: #dc2626; }
        .btn:disabled { background: #9ca3af; cursor: not-allowed; }
        .messages li { list-style: none; padding: 8px 12px; margin-bottom: 8px; border-radius: 4px; background: #e0f2fe; }
        .messages li.error { background: #fee2e2; }
        .messages li.success { background: #dcfce7; }
        .errorlist { color: #dc2626; padding-left: 16px; margin: 4px 0; }
        form p { margin: 12px 0; }
        form input[type=text], form input[type=email], form input[type=password], form input[type=date] { padding: 6px; width: 300px; }
        .pagination { display: flex; gap: 12px; align-items: center; }
        .filter-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
        .filter-form input[type=text], .filter-form input[type=date] { width: auto; min-width: 150px; padding: 6px; }
        .filter-form label { font-size: 14px; color: #555; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}"><strong>HR App</strong></a>
    {% if user.is_authenticated %}
      {% if user.is_staff %}
        <a href="{% url 'employee-list' %}">Karyawan</a>
      {% endif %}
      <a href="{% url 'attendance-list' %}">Absensi</a>
      <span class="spacer"></span>
      <span style="color:#9ca3af">{{ user.username }}</span>
      <form method="post" action="{% url 'logout' %}" style="margin:0">
        {% csrf_token %}
        <button type="submit">Logout</button>
      </form>
    {% endif %}
  </nav>
  <main>
    {% if messages %}
      <ul class="messages" style="padding:0">
        {% for message in messages %}
          <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
